apiVersion: v1alpha1
name: redis
tag: 24.0.0-c01
description: Redis server
schema:
  parameters:
    description: Redis server
    properties:
      password: { type: string, default: redis123 }
      replicaCount: { type: integer, default: 1, description: "The number of replicas"}

modules:
  - name: noname
    source:
      oci:
        repository: registry-1.docker.io/bitnamicharts/redis
        tag: 24.0.0
    values: |
      global:
        redis:
          password: {{ .Parameters.password }}
        security:
          allowInsecureImages: true
      master:
        persistence:
          enabled: false
      replica:
        persistence:
          enabled: false
        replicaCount: {{ .Parameters.replicaCount }}

outputs:
  - interface: redis-access
    kind: Connection
    values:
      host: "{{ printf \"%s-master\" .Release.metadata.name }}.{{ .Release.spec.targetNamespace | default .Release.metadata.namespace }}.svc"
      password: "{{ .Parameters.password }}"

