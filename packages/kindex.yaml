
apiVersion: v1alpha1
name: kindex
tag: 0.1.0-c01
protected: true
schema:
  parameters:
    properties:
      host: { type: string, default: kindex }
      tls: { type: boolean, default: true }
      mode: { type: string, default: dark, enum: ["dark", "light"] }
      deployInControlPlane: { type: boolean, default: false }
      deployInServicePlane: { type: boolean, default: false }

modules:
  - name: noname
    source:
      oci:
        repository: quay.io/kubosa/charts/kindex
        tag: 0.1.0-snapshot
    timeout: 1m
    values: |
      {{- if .Parameters.deployInControlPlane }}
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      {{- end }}
      {{- if .Parameters.deployInServicePlane }}
      tolerations:
        - key: services.node-role.kubernetes.io
          operator: "Equal"
          effect: NoSchedule
          value: services
      nodeSelector:
        services.node-role.kubernetes.io: "services"
      {{- end }}
      ingress:
        enabled: true
        class: {{ .Inputs.ingress.className }}
        host: {{ .Parameters.host }}.{{.Inputs.ingress.domain}}
        networkPolicy:
          enabled: {{ .Inputs.cluster.networkPolicies }}
        passthrough: {{  .Parameters.tls }}
      server:
        tls: {{ .Parameters.tls }}
        certificateIssuer: {{ .Inputs.certManager.clusterIssuers.public }}
        mode: {{ .Parameters.mode }}
        clusterName: {{ .Inputs.cluster.name }}

inputs:
  - contract: ingress
  - contract: cluster
  - contract: cert-manager
    alias: certManager