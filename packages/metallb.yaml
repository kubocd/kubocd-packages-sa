
apiVersion: v1alpha1
name: metallb
tag: 0.14.9-c01
protected: true
schema:
  parameters:
    properties:
      deployInControlPlane: { type: boolean, default: false }
      deployInServicePlane: { type: boolean, default: false }
      speakerTolerations:
        items:
          properties:
            key: { type: string, required: true }
            operator: { type: string, required: true }
            effect: { type: string, required: false }
            value: { type: string, required: false }
            tolerationSeconds: { type: integer, required: false }
      pool:
        required: false
        properties:
          first: { type: string, required: true }
          last: { type: string, required: true }

modules:
  - name: noname
    timeout: 4m
    source:
      helmRepository:
        url: https://metallb.github.io/metallb
        chart: metallb
        version: 0.14.9
    values: |
      controller:
        {{- if .Parameters.deployInControlPlane }}
        tolerations:
          - key: "node-role.kubernetes.io/control-plane"
            operator: "Exists"
            effect: "NoSchedule"
        nodeSelector:
          node-role.kubernetes.io/control-plane: ""
        {{- end }}      
        {{- if .Parameters.deployInServicePlane }}
        tolerations:
          - key: services.node-role.kubernetes.io
            operator: "Equal"
            effect: NoSchedule
            value: services
        nodeSelector:
          services.node-role.kubernetes.io: "services"
        {{- end }}
        image:
          {{ $redirection := imageRedirect "quay.io/metallb/controller" . }}
          repository: {{ $redirection.repository }}
      speaker:
        {{- with .Parameters.speakerTolerations }}
        tolerations:
        {{- range . }}
          - key: {{ .key }}
            operator: {{ .operator }}
            {{ with .effect }}effect: {{.}}{{end}}
            {{ with .value }}value: {{.}}{{end}}
            {{ with .tolerationSeconds }}tolerationSeconds: {{.}}{{end}}
        {{- end }}
        {{- end }}
        image:
          {{ $redirection := imageRedirect "quay.io/metallb/speaker" . }}
          repository: {{ $redirection.repository }}
        frr:
          image:
            {{ $redirection := imageRedirect "quay.io/frrouting/frr" . }}
            repository: {{ $redirection.repository }}
  - name: pool
    source:
      local:
        path: ../charts/metallb-pool/0.1.0
    values: |
      {{- if .Parameters.pool }}
        - first: {{ resolveDNS (.Parameters.pool.first) }}
          last:  {{ resolveDNS (.Parameters.pool.last) }}
      {{- else if .Inputs.cluster }}
      ipRanges:
        - first: {{ resolveDNS ( printf "first.pool.%s" .Inputs.cluster.domain ) }}
          last:  {{ resolveDNS ( printf "last.pool.%s" .Inputs.cluster.domain ) }}
      {{- else }}
        {{ fail "At least one of .Parameters.pool... or .Inputs.cluster.domain must be defined" }} 
      {{- end }}
    dependsOn:
      - noname

inputs:
  - interface: cluster

outputs:
  - interface: load-balancer
    kind: ClusterConnection